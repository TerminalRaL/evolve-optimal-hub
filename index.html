    /* Custom subtle architectural grid & scrollbar */
    body {
      background-color: #06080B;

      overflow-x: hidden;

    /* Glassmorphism panels */
    .glass-panel {
      background: rgba(16, 22, 32, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);

      background: rgba(11, 15, 21, 0.82);
      backdrop-filter: blur(20px);

      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.75);
    }

    /* Periodic Table Matrix Layout (18 columns on large screens, adaptive below) */
    .periodic-grid {
      display: grid;
      grid-template-columns: repeat(18, minmax(54px, 1fr));
      gap: 6px;
    }

    @media (max-width: 1200px) {
      .periodic-grid {
        grid-template-columns: repeat(9, minmax(68px, 1fr));
      }
      .periodic-tile {
        grid-column: auto !important;
        grid-row: auto !important;
      }
    }

    @media (max-width: 640px) {
      .periodic-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
    }

    /* Periodic Element Tile Hover & Pop-out Window */
    .periodic-tile {
      position: relative;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .periodic-tile:hover,
    .periodic-tile.is-hovered {
      z-index: 40;
      transform: translateY(-3px) scale(1.04);
    }

    /* Floating Expansion Window on Desktop Hover */
    .element-hover-card {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(8px) scale(0.96);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (min-width: 1024px) {
      .periodic-tile:hover .element-hover-card,
      .periodic-tile:focus-within .element-hover-card {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateY(0) scale(1);
      }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #06080B;
    }
    ::-webkit-scrollbar-thumb {
      background: #1F2A3C;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #C9A86A;
    }

      outline-offset: 4px;
      border-radius: 12px;
    }

  <script>
    /**
     * EVOLVE OPTIMAL — STANDALONE MULTI-PAGE SPA ENGINE
     * Architecture:
     * 1. DEFAULT_DATA: Parsed cleanly from <script id="evolve-default-data" type="application/json">.
     * 2. State Persistence: Syncs automatically with localStorage ('evolve_optimal_state_v1') with 1-click HTML & JSON export.
     * 3. Hash Router: Supports #home, #journal, #culinary, #elements seamlessly.
     * 4. Creator Studio: Inline editing + rich creation modals for adding/modifying any entry.
     */

    const STORAGE_KEY = 'evolve_optimal_state_v1';

    function getEmbeddedDefaultData() {
      try {
        const dataEl = document.getElementById('evolve-default-data');
        if (!dataEl) throw new Error('Embedded default data tag not found.');
        return JSON.parse(dataEl.textContent.trim());
      } catch (err) {
        console.error('Failed to parse embedded default data:', err);
        return { home: { highlights: [] }, articles: [], recipes: [], elements: [], completedElements: [] };
      }
    }

    const DEFAULT_DATA = getEmbeddedDefaultData();

    const ELEMENT_CATEGORIES = {
      neuro: {
        label: 'Neuro-Regulation',
        color: 'cyan',

        accentText: 'text-champagne-400'

        label: 'Resilience & Crisis',
        color: 'rose',
        badgeClass: 'bg-rose-500/15 text-rose-300 border-rose-400/30',

    // Application Runtime State
    let appState = loadState();
    let currentRoute = getRouteFromHash();
    let studioMode = false;
    let activeJournalCategory = 'All';
    let activeCulinaryCategory = 'All';
    let culinarySearchQuery = '';
    let activeElementCategory = 'All';
    let selectedElementId = appState.elements[0]?.id || null;

    // ==================== STATE PERSISTENCE ====================
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(DEFAULT_DATA);
        const parsed = JSON.parse(raw);
        return {
          ...structuredClone(DEFAULT_DATA),
          ...parsed
        };
      } catch (err) {
        console.warn('Failed to parse saved state, falling back to defaults.', err);
        return structuredClone(DEFAULT_DATA);
      }
    }

    function saveState(notify = false) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        if (notify) showToast('Changes saved to local studio storage', 'success');
      } catch (err) {
        showToast('Unable to save to localStorage (storage quota full)', 'error');
      }
    }

    // ==================== ROUTING & NAVIGATION ====================
    function getRouteFromHash() {
      const hash = window.location.hash.replace('#', '').trim().toLowerCase();
      const valid = ['home', 'journal', 'culinary', 'elements'];
      return valid.includes(hash) ? hash : 'home';
    }

    function navigateTo(route) {
      currentRoute = route;
      if (window.location.hash !== `#${route}`) {
        history.pushState(null, '', `#${route}`);
      }
      updateNavHighlight();
      renderCurrentPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('hashchange', () => {
      currentRoute = getRouteFromHash();
      updateNavHighlight();
      renderCurrentPage();
    });

    function updateNavHighlight() {
      document.querySelectorAll('.nav-tab').forEach(btn => {
        const isActive = btn.dataset.tab === currentRoute;
        if (isActive) {
          btn.className = 'nav-tab px-4 py-2 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 bg-gradient-to-r from-champagne-400/20 to-bio-emerald/15 text-champagne-300 border border-champagne-400/35 shadow-sm';
        } else {
          btn.className = 'nav-tab px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2 text-slate-400 hover:text-white hover:bg-white/5 border border-transparent';
        }
      });

      document.querySelectorAll('.nav-tab-mobile').forEach(btn => {
        const isActive = btn.dataset.tab === currentRoute;
        if (isActive) {
          btn.className = 'nav-tab-mobile p-3 rounded-xl text-sm font-semibold flex items-center gap-2.5 text-left bg-champagne-400/15 text-champagne-300 border border-champagne-400/30';
        } else {
          btn.className = 'nav-tab-mobile p-3 rounded-xl text-sm font-medium flex items-center gap-2.5 text-left text-slate-300 hover:bg-white/5 border border-transparent';
        }
      });
    }

    function toggleMobileMenu(forceState) {
      const menu = document.getElementById('mobile-nav-menu');
      if (typeof forceState === 'boolean') {
        menu.classList.toggle('hidden', !forceState);
      } else {
        menu.classList.toggle('hidden');
      }
    }

    // ==================== CREATOR STUDIO MODE ====================
    function toggleStudioMode() {
      studioMode = !studioMode;
      document.body.classList.toggle('studio-active', studioMode);

      const btn = document.getElementById('studio-toggle-btn');
      const dot = document.getElementById('studio-indicator-dot');
      const banner = document.getElementById('studio-banner');

      if (studioMode) {
        btn.classList.add('border-champagne-400', 'text-champagne-300', 'bg-champagne-400/10');
        dot.classList.remove('bg-slate-500');
        dot.classList.add('bg-bio-emerald', 'animate-ping');
        banner.classList.remove('hidden');
        showToast('Creator Studio unlocked — click any edit icon or + button to customize', 'info');
      } else {
        btn.classList.remove('border-champagne-400', 'text-champagne-300', 'bg-champagne-400/10');
        dot.classList.add('bg-slate-500');
        dot.classList.remove('bg-bio-emerald', 'animate-ping');
        banner.classList.add('hidden');
      }

      renderCurrentPage();
    }

    // Keyboard shortcut Ctrl+E / Cmd+E for Studio Mode
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'e') {
        e.preventDefault();
        toggleStudioMode();
      }
      if (e.key === 'Escape') {
        closeModal();
      }
    });

    // ==================== PAGE RENDER DISPATCHER ====================
    function renderCurrentPage() {
      const viewport = document.getElementById('app-viewport');
      if (currentRoute === 'home') {
        viewport.innerHTML = renderHomePage();
      } else if (currentRoute === 'journal') {
        viewport.innerHTML = renderJournalPage();
      } else if (currentRoute === 'culinary') {
        viewport.innerHTML = renderCulinaryPage();
      } else if (currentRoute === 'elements') {
        viewport.innerHTML = renderElementsPage();
      }
      lucide.createIcons();
    }

    function toggleElementCompletion(id) {
      const idx = appState.completedElements.indexOf(id);

        showToast('Training module marked as mastered!', 'success');

      saveState();
      renderCurrentPage();
      openTrainingModal(id);
    }

    /**
     * Generates a clean, ready-to-upload index.html file by cloning the current document,
     * stripping transient UI/studio states, and baking the live appState JSON into
     * <script id="evolve-default-data" type="application/json">.
     */
    function downloadUpdatedHtmlFile() {
      try {
        // Clone the live DOM so the user's current session remains undisturbed
        const docClone = document.documentElement.cloneNode(true);

        // 1. Clean body classes (remove studio-active outline mode)
        const bodyClone = docClone.querySelector('body');
        if (bodyClone) {
          bodyClone.classList.remove('studio-active');
        }

        // 2. Reset Studio toggle button & banner to clean default state
        const studioBtn = docClone.querySelector('#studio-toggle-btn');
        if (studioBtn) {
          studioBtn.classList.remove('border-champagne-400', 'text-champagne-300', 'bg-champagne-400/10');
        }
        const studioDot = docClone.querySelector('#studio-indicator-dot');
        if (studioDot) {
          studioDot.classList.remove('bg-bio-emerald', 'animate-ping');
          studioDot.classList.add('bg-slate-500');
        }
        const studioBanner = docClone.querySelector('#studio-banner');
        if (studioBanner) {
          studioBanner.classList.add('hidden');
        }

        // 3. Hide mobile menu, modals, and clear transient containers so there is zero duplicate DOM
        const mobileMenu = docClone.querySelector('#mobile-nav-menu');
        if (mobileMenu) mobileMenu.classList.add('hidden');

        const modalBackdrop = docClone.querySelector('#modal-backdrop');
        if (modalBackdrop) modalBackdrop.classList.add('hidden');

        const modalContainer = docClone.querySelector('#modal-container');
        if (modalContainer) modalContainer.innerHTML = '';

        const toastContainer = docClone.querySelector('#toast-container');
        if (toastContainer) toastContainer.innerHTML = '';

        const appViewport = docClone.querySelector('#app-viewport');
        if (appViewport) {
          appViewport.innerHTML = '\n    <!-- Dynamic Page Content Injected Here -->\n  ';
        }
        // 4. Bake the current live appState into #evolve-default-data with safe script-tag escaping
        const dataScript = docClone.querySelector('#evolve-default-data');
        if (!dataScript) {
          throw new Error('Could not locate #evolve-default-data script block.');
        }
        const closeScriptPattern = new RegExp('</' + 'script>', 'gi');
        const safeJson = JSON.stringify(appState, null, 2).replace(closeScriptPattern, '<\\/' + 'script>');
        dataScript.textContent = '\n' + safeJson + '\n  ';

        // 5. Serialize complete HTML document with DOCTYPE and trigger download
        const finalHtml = '<!DOCTYPE html>\n' + docClone.outerHTML;
        const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);

        showToast('Downloaded updated index.html — ready to upload to GitHub!', 'success');
      } catch (err) {
        console.error('Failed to generate updated index.html:', err);
        showToast('Error generating updated index.html file.', 'error');
      }
    }

    function downloadJsonBackup() {
      const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(appState, null, 2));
      const a = document.createElement('a');
      a.setAttribute('href', dataStr);
      a.setAttribute('download', 'evolve-optimal-site-data.json');
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('Downloaded evolve-optimal-site-data.json', 'success');
    }

    function copyJsonToClipboard() {
      const box = document.getElementById('json-export-box');
      if (!box) return;
      box.select();
      document.execCommand('copy');
      showToast('JSON copied to clipboard', 'success');
    }

    function handleJsonImport(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          appState = { ...structuredClone(DEFAULT_DATA), ...parsed };
          saveState();
          closeModal();
          renderCurrentPage();
          showToast('Site data imported successfully!', 'success');
        } catch (err) {
          showToast('Invalid JSON file format', 'error');
        }
      };
      reader.readAsText(file);
    }

    function resetToFactoryDefaults() {
      appState = structuredClone(DEFAULT_DATA);
      localStorage.removeItem(STORAGE_KEY);
      closeModal();
      renderCurrentPage();
      showToast('Restored embedded Evolve Optimal content', 'info');
    }

    // ==================== UTILITIES ====================
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatRichText(raw) {
      return escapeHtml(raw)
        .split('\n\n')
        .map(block => {
          if (block.startsWith('### ')) {
            return `<h3 class="font-display font-bold text-xl text-white pt-3">${block.replace('### ', '')}</h3>`;
          }
          return `<p>${block.replace(/\n/g, '<br/>')}</p>`;
        })
        .join('');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'border-bio-emerald/50 bg-obsidian-900 text-bio-emerald',
        error: 'border-rose-500/50 bg-obsidian-900 text-rose-300',
        info: 'border-champagne-400/50 bg-obsidian-900 text-champagne-300'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl border shadow-xl font-mono text-xs flex items-center gap-2.5 animate-pop-in ${colors[type] || colors.info}`;
      el.innerHTML = `<span class="w-2 h-2 rounded-full bg-current"></span><span>${escapeHtml(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.3s ease';
        setTimeout(() => el.remove(), 300);
      }, 3200);
    }

    // ==================== INITIALIZE APPLICATION ====================
    window.addEventListener('DOMContentLoaded', () => {
      updateNavHighlight();
      renderCurrentPage();
    });
  </script>
</body>
</html>
